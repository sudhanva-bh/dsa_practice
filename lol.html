<!DOCTYPE html>
<html>

<head>
    <title>Road Network Visualizer</title>

    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js">
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        #network {
            width: 100vw;
            height: 100vh;
            border: 1px solid lightgray;
        }
    </style>
</head>

<body>

    <div id="network"></div>

    <script>

        const n = 14;

        const roads = [[2, 9, 2308], [2, 5, 2150], [12, 3, 4944], [13, 5, 5462], [2, 10, 2187], [2, 12, 8132], [2, 13, 3666], [4, 14, 3019], [2, 4, 6759], [2, 14, 9869], [1, 10, 8147], [3, 4, 7971], [9, 13, 8026], [5, 12, 9982], [10, 9, 6459]];

        // =======================
        // CREATE NODES
        // =======================

        const nodes = [];

        for (let i = 1; i <= n; i++) {

            let color = {
                background: "#4CAF50",
                border: "#2E7D32"
            };

            // Highlight source
            if (i === 1) {
                color = {
                    background: "#2196F3",
                    border: "#0D47A1"
                };
            }

            // Highlight destination
            if (i === n) {
                color = {
                    background: "#F44336",
                    border: "#B71C1C"
                };
            }

            nodes.push({
                id: i,
                label: String(i),
                shape: "circle",
                size: 28,
                color: color,
                font: {
                    color: "white",
                    size: 18,
                    face: "Arial"
                }
            });
        }

        // =======================
        // CREATE EDGES
        // =======================

        const edges = [];

        for (const [u, v, w] of roads) {
            edges.push({
                from: u,
                to: v,
                label: String(w),
                font: {
                    align: "middle",
                    size: 16
                },
                width: 2,
                smooth: {
                    type: "continuous"
                }
            });
        }

        // =======================
        // VISUALIZE
        // =======================

        const container = document.getElementById("network");

        const data = {
            nodes: new vis.DataSet(nodes),
            edges: new vis.DataSet(edges)
        };

        const options = {

            physics: {
                enabled: true,
                stabilization: true
            },

            interaction: {
                hover: true,
                dragNodes: true,
                zoomView: true,
                dragView: true
            },

            edges: {
                color: "#666666",
                smooth: {
                    type: "continuous"
                }
            },

            nodes: {
                borderWidth: 2
            }
        };

        new vis.Network(container, data, options);

    </script>

</body>

</html>
